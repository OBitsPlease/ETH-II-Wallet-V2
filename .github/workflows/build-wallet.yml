name: Build ETH II Wallet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Test wallet security controls
        run: npm test
      - name: Audit all dependencies
        run: npm audit

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run build:win -- --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ETH-II-Wallet-Windows
          path: dist/*.exe

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Linux AppImage
        run: npm run build:linux -- --publish never
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ETH-II-Wallet-Linux
          path: dist/*.AppImage

  build-macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build macOS DMGs
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS DMGs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ETH-II-Wallet-macOS
          path: dist/*.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ETH-II-Wallet-Windows
          path: release/
      - name: Download Linux build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ETH-II-Wallet-Linux
          path: release/
      - name: Download macOS builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ETH-II-Wallet-macOS
          path: release/
      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum *.exe *.AppImage *.dmg > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          name: ETH II Wallet ${{ github.ref_name }}
          body: |
            ## ETH II Wallet ${{ github.ref_name }}

            ### Downloads
            - **Windows**: ETH II Wallet Setup *.exe
            - **Linux**: ETH II Wallet-*.AppImage
            - **macOS (Intel and Apple Silicon)**: ETH II Wallet-*.dmg

            ### Installation
            1. Download the installer for your platform
            2. Verify it against SHA256SUMS.txt
            3. Run it -- the ETH II node is bundled, no extra downloads needed
            4. Launch from your desktop shortcut

            Existing encrypted wallets in the operating system user-data directory are preserved during updates.

            ### Network Info
            Chain ID: 20482 | Block Reward: 5 ETHII | Consensus: Ethash PoW
            Public RPC: https://ethii.net/rpc
            Explorer: https://ethii.net/explorer.html
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
